[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kitchenwatch"
version = "0.1.0"
description = "Won't put dinner on your calendar that your fridge cannot feed."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pillow>=10.0", "httpx>=0.27"]
vision = ["google-genai>=1.0", "pillow>=10.0"]
app = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "google-cloud-firestore>=2.16",
  "google-genai>=1.0",
  "google-adk>=1.0",
  "google-api-python-client>=2.150",
  "google-auth>=2.35",
  "google-auth-httplib2>=0.2",
  "pillow>=10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kitchenwatch = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: calls Vertex Gemini (opt in with KITCHENWATCH_LIVE=1)",
]
